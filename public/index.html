<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <form id="shorten-form">
        <div>
          <input type="url" name="url" id="url" required />
        </div>
        <div>
          <label for="shortCode">Enter shortCode:</label>
          <input type="text" name="shortCode" id="shortCode" required />
        </div>
        <button type="submit" id="button">Shorten</button>
      </form>

      <h2>Shortened URLs</h2>
      <ul id="shortened-urls"></ul>
    </div>

    <script type="module">
      const fetchShortenedURL = async () => {
        try {
          console.log("fetchShortenedURL called");
          const response = await fetch("/links");
          const links = await response.json();
          console.log(links, "links");

          const list = document.getElementById("shortened-urls");
          list.innerHTML = "";

          for (const [shortcode, url] of Object.entries(links)) {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${shortcode}" target="_blank">
            ${window.location.origin}/${shortcode}</a> - ${url}`;
            list.appendChild(li);
          }
        } catch (error) {
          console.log(error);
        }
      };

      const form = document.getElementById("shorten-form");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(event.target);
        const url = formData.get("url");
        const shortCode = formData.get("shortCode");

        try {
          const response = await fetch("/shorten", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, shortcode: shortCode }), // Backend 'shortcode' expect kar raha hai
          });

          if (response.ok) {
            fetchShortenedURL();
            const result = await response.json();
            // console.log("form submitted successfully", result);
            alert("Short code ban gaya: " + result.shortCode);
            event.target.reset();
          } else {
            const errorMessage = await response.text();
            alert(errorMessage);
          }
        } catch (error) {
          console.log("Error:", error);
        }
      });

      fetchShortenedURL();
    </script>
  </body>
</html>
